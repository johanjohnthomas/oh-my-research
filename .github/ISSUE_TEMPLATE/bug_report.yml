name: Bug Report
description: Report a bug or unexpected behavior in oh-my-research
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Please write your issue in English.** See our [Language Policy](../CONTRIBUTING.md) for details.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting
      options:
        - label: I will write this issue in English (see our [Language Policy](../CONTRIBUTING.md))
          required: true
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am using the latest version of oh-my-research
          required: true
        - label: I have read the [documentation](../docs/reference/cli.md) or asked an AI coding agent with this project's GitHub URL loaded and couldn't find the answer
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug in detail...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Configure oh-my-research with...
        2. Run command '...'
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor Output
      description: |
        If relevant, include the output from the current documented verification path and any failing command output.
      placeholder: |
        Paste the relevant output of: bun run typecheck / bun test / bun run build / bun run verify:product
        
        Example:
        ✓ oh-my-research version: 1.2.3
        ✓ workspace-run completed
        ✓ verify:product completed
        ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: If applicable, add any error messages or logs
      placeholder: Paste error logs here...
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: If relevant, share your oh-my-research configuration or workspace bundle details (remove sensitive data)
      placeholder: |
        {
          "agents": { ... },
          "disabled_hooks": [ ... ]
        }
      render: json

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Add any other context, screenshots, or information...

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you using?
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: opencode-version
    attributes:
      label: Runtime / CLI Version
      description: Provide the relevant `oh-my-research` or host runtime version if applicable
      placeholder: "oh-my-research 3.16.0"
    validations:
      required: true
